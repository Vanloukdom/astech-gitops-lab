apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: astech-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Vanloukdom/astech-gitops-lab.git
    targetRevision: main
    path: helm/astech-app
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml          # l'ordre compte : le dernier l'emporte
  destination:
    server: https://kubernetes.default.svc
    namespace: astech-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
