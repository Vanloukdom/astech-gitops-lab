apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: astech-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Vanloukdom/astech-gitops-lab.git
    targetRevision: main
    path: helm/astech-app
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: astech-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true       # pas de bloc "automated" : sync manuelle
