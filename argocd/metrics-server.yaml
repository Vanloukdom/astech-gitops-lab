apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/   # dépôt de charts, pas Git
    chart: metrics-server                                        # nom du chart
    targetRevision: 3.14.0                                       # version du chart
    helm:
      valuesObject:                                              # équivalent de --set
        args:
          - --kubelet-insecure-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
