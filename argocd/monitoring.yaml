apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 93.10.0
    helm:
      valuesObject:
        alertmanager:
          enabled: true
          alertmanagerSpec:
            useExistingSecret: true
            configSecret: alertmanager-config
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits:   { memory: 128Mi }
        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeProxy:
          enabled: false
        prometheus:
          prometheusSpec:
            retention: 2d
            resources:
              requests: { cpu: 100m, memory: 400Mi }
              limits:   { memory: 1Gi }
        grafana:
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - grafana.93.127.162.226.nip.io
          additionalDataSources:
            - name: Loki
              type: loki
              uid: loki
              url: http://loki.monitoring.svc:3100
              jsonData:
                derivedFields:
                  - name: TraceID
                    matcherRegex: 'trace_id=(\w+)'
                    url: '$${__value.raw}'
                    datasourceUid: tempo
            - name: Tempo
              type: tempo
              uid: tempo
              url: http://tempo.monitoring.svc:3200
              jsonData:
                tracesToLogsV2:
                  datasourceUid: loki
                  filterByTraceID: true
                  spanStartTimeShift: '-5m'
                  spanEndTimeShift: '5m'
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true      # indispensable : les CRD de ce chart sont trop volumineuses sans cette optionx
