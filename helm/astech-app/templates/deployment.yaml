apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-astech-app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: astech-app
  template:
    metadata:
      labels:
        app: astech-app
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: astech-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
