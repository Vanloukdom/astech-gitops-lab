{{- if .Values.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-alerts
  labels:
    release: monitoring        # requis : Prometheus ne charge que les règles portant ce label
spec:
  groups:
    - name: {{ .Release.Name }}.rules
      rules:
        - alert: AstechReplicasManquants
          expr: |
            kube_deployment_spec_replicas{namespace="{{ .Release.Namespace }}"}
              - kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}"} > 0
          for: 2m
          labels:
            severity: {{ .Values.alerts.severity }}
          annotations:
            summary: "Pods indisponibles dans {{ .Release.Namespace }}"
            description: "{{`{{ $value }}`}} pod(s) manquant(s) depuis plus de 2 minutes."

        - alert: AstechRedemarragesFrequents
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}"}[10m]) > 2
          labels:
            severity: {{ .Values.alerts.severity }}
          annotations:
            summary: "Redémarrages répétés dans {{ .Release.Namespace }}"
            description: "Le pod {{`{{ $labels.pod }}`}} a redémarré {{`{{ $value | humanize }}`}} fois en 10 minutes."

        - alert: AstechMemoireProcheLimite
          expr: |
            sum by (pod) (container_memory_working_set_bytes{namespace="{{ .Release.Namespace }}", container="astech-app"})
              / sum by (pod) (kube_pod_container_resource_limits{namespace="{{ .Release.Namespace }}", container="astech-app", resource="memory"})
              > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Mémoire > 80 % de la limite dans {{ .Release.Namespace }}"
            description: "Le pod {{`{{ $labels.pod }}`}} utilise {{`{{ $value | humanizePercentage }}`}} de sa limite mémoire."
{{- end }}
